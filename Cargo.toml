[package]
name = "beta1-datachain"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
description = "La Bataille de France, beta 1 : sources et chaîne de production des tiles."
repository = "https://github.com/labatailledefrance/beta1-datachain"
publish = false

# Versions exactes, publiées depuis au moins deux semaines.
[dependencies]
# Format des tiles, partagé avec le serveur et le client (même tag partout).
beta1-common = { version = "=0.4.0", git = "https://github.com/labatailledefrance/beta1-common", tag = "v0.4.0" }
# HTTP bloquant, TLS en Rust (rustls), sans décompression transparente : les
# octets reçus sont ceux qu'on vérifie.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# L'IGN ne publie que des MD5 ; le SHA-256 est calculé par le projet.
md-5 = "=0.11.0"
sha2 = "=0.11.1"
clap = { version = "=4.6.7", features = ["derive"] }
# Carreaux de 1 km de l'INSEE (Martinique, La Réunion), livrés en zip.
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }

# Chaîne (versions de P-26, vérifiées le 2026-11-16).
# SQLite compilé depuis ses sources : un GeoPackage est une base SQLite.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Lecture en flux des archives 7z de l'IGN, sans décompression sur disque.
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress"] }
zstd = "=0.14.3"
# Opérations booléennes entières (P-08) : nettoyage des emprises auto-sécantes.
i_overlay = "=9.1.0"
rayon = "=1.12.0"
blake3 = "=1.8.7"
# Ordre de la hiérarchie routière (CCH, dissection imbriquée), version de P-09 et P-26.
cch = "=0.3.0"
# Carreaux de 200 m de l'INSEE (Parquet), API par lignes, sans Arrow.
parquet = { version = "=59.3.2", default-features = false, features = ["snap", "zstd", "flate2", "flate2-rust_backend", "lz4", "brotli"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 16

