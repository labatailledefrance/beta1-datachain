# cargo deny : licences compatibles AGPL, alertes RustSec, sources autorisées.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Exceptions justifiées, à réexaminer à chaque mise à jour des dépendances.
ignore = [
  # parquet : texte en clair dans les filtres de Bloom à l'écriture d'un
  # fichier chiffré. La chaîne ne fait que lire des Parquet en clair (feature
  # « encryption » absente). Corrigé en 59.3.3 (2026-11-17) : à monter dès
  # qu'elle a deux semaines (2026-12-01).
  { id = "RUSTSEC-2026-0595", reason = "écriture chiffrée seulement ; la chaîne ne fait que lire, sans chiffrement" },
  # chrono non maintenu, sans vulnérabilité connue : dépendance obligatoire de parquet.
  { id = "RUSTSEC-2026-0543", reason = "non maintenu, pas de faille connue ; requis par parquet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Liste commune à tous les dépôts : une licence absente ici n'est pas une erreur.
unused-allowed-license = "allow"
# Licences compatibles avec l'AGPL-3.0-or-later du projet.
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # webpki-roots : certificats racines de Mozilla (données, licence permissive).
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-org = { github = ["labatailledefrance"] }
